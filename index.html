<style>

:root[data-theme="dark"]{--bg:#0c1624;--card:#13233a;--ink:#e6eefb;--mut:#9fb3cf;--line:#223754;--pri:#5aa7ff;--pri2:#3b8df0;--soft:#17304f;--cl:#3fd0bd;--cl-soft:#10332f;--ok:#3ccf86;--ok-soft:#10342340;--warn:#f0b04a;--warn-soft:#3a2c10;--bad:#ff7b7b;--shadow:0 6px 24px rgba(0,0,0,.35);--grad:linear-gradient(120deg,#1d4f8f,#2a74c9)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--pri)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(10,86,168,.06)}
.top .bar{display:flex;align-items:center;gap:12px;height:56px}
.brandpair{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.bmark{background:var(--grad);color:#fff;border-radius:9px;padding:4px 10px;font-weight:800;letter-spacing:.2px}
.x{color:var(--mut);font-weight:500}
.cmark{display:flex;align-items:center;gap:8px}
.cav{width:30px;height:30px;border-radius:50%;background:var(--cl);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;font:inherit;font-size:14px}
nav.sec{position:relative;display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
nav.sec::-webkit-scrollbar{display:none}
nav.sec button{flex:none;border:0;background:transparent;color:var(--mut);font:inherit;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.sec button.on{background:var(--soft);color:var(--pri)}
.hero{background:var(--grad);color:#fff;border-radius:22px;margin:22px 0;padding:28px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .pairs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.hero .bmark{background:#fff;color:var(--pri)}
.hero .cav{background:#fff;color:var(--cl)}
.hero h1{font-size:clamp(24px,4vw,36px);line-height:1.2;margin:14px 0 6px;font-weight:800}
.hero p.sub{margin:0 0 14px;opacity:.92;max-width:760px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px}
.pill i{width:8px;height:8px;border-radius:50%;background:#7dffb1;display:inline-block}
.scope{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scope b{font-size:13px;opacity:.9}
.hchip{background:rgba(255,255,255,.16);border-radius:8px;padding:3px 10px;font-size:12.5px;font-weight:600}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.hc{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:14px;min-height:112px}
.hc small{display:block;opacity:.85;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.hc strong{display:block;font-size:17px;line-height:1.3}
.hc span{display:block;font-size:13px;opacity:.9;margin-top:4px}
.bar2{height:8px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:8px;overflow:hidden}
.bar2 i{display:block;height:100%;background:#fff;border-radius:99px}
.mtl{margin-top:22px;overflow-x:auto;padding-bottom:4px}
.mtl .tr{position:relative;min-width:800px;height:96px}
.mtl .line{position:absolute;left:50px;right:50px;top:22px;height:4px;background:rgba(255,255,255,.3);border-radius:4px}
.mtl .fill{position:absolute;left:50px;top:22px;height:4px;background:#fff;border-radius:4px}
.mtl .m{position:absolute;top:14px;width:100px;transform:translateX(-50%);text-align:center;font-size:12px}
.mtl .m i{display:block;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid #fff;margin:0 auto 6px}
.mtl .m.d i{background:#fff}
.mtl .m b{display:block;font-size:12.5px}
.mtl .now{position:absolute;top:4px;width:2px;height:36px;background:#ffd166;z-index:2}
.mtl .now em{position:absolute;top:-4px;left:6px;white-space:nowrap;font-style:normal;font-size:10.5px;background:#ffd166;color:#523;border-radius:6px;padding:0 6px;font-weight:700}
section.blk{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px;margin:0 0 22px}
.blk h2{margin:0 0 4px;font-size:21px;display:flex;align-items:center;gap:10px}
.blk h2 .no{background:var(--grad);color:#fff;border-radius:9px;font-size:13px;padding:2px 9px}
.blk .lead{color:var(--mut);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.box{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card)}
.box h3{margin:0 0 6px;font-size:16px}
.box p{margin:0;color:var(--mut);font-size:14px}
.goal{background:var(--soft);border-color:transparent}
.goal .n{font-weight:800;color:var(--pri);font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.chip.b{background:var(--soft);color:var(--pri)}
.chip.o{background:var(--warn-soft);color:var(--warn)}
.chip.r{background:rgba(214,69,69,.12);color:var(--bad)}
.chip.n{background:var(--line);color:var(--mut)}
.appcard{display:flex;flex-direction:column;gap:6px}
.appcard .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.appcard .t b{font-size:14.5px}
.flow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:16px}
.flow .fn{flex:1;min-width:150px;border-radius:12px;padding:12px;background:var(--soft);font-size:13.5px}
.flow .fn b{display:block}
.flow .ar{align-self:center;color:var(--mut)}
.tblw{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.tb th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line)}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rolebase{background:var(--soft)}
h4.sh{margin:18px 0 8px;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;background:var(--card)}
.step.active{border-color:var(--pri2);box-shadow:0 0 0 3px var(--soft)}
.step.done{background:var(--ok-soft);border-color:transparent}
.step .sn{font-weight:800;color:var(--pri);font-size:12.5px}
.step h3{margin:2px 0 2px;font-size:16px}
.step .dt{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.step ul{margin:0 0 10px;padding-left:18px;font-size:13px}
.step ul li{margin-bottom:3px}
.gate{font-size:12.5px;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--mut)}
.gate b{color:var(--ink)}
.pbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 8px}
.pbar i{display:block;height:100%;background:var(--grad)}
.sess{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;background:var(--card);overflow:hidden}
.sess.today,.sess.next1{border-color:var(--pri2)}
.sess summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:14px 16px}
.sess summary::-webkit-details-marker{display:none}
.sess .sno{background:var(--soft);color:var(--pri);border-radius:12px;text-align:center;padding:6px 4px;font-weight:800;font-size:13px;line-height:1.25}
.sess .sno small{display:block;font-weight:600;color:var(--mut);font-size:11px}
.sess .stt{font-weight:700}
.sess .meta{color:var(--mut);font-size:13px}
.sess .body{padding:0 16px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;border-top:1px dashed var(--line);padding-top:14px}
.sess .body h5{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.sess .body ul{margin:0;padding-left:18px;font-size:14px}
.sess .body li{margin-bottom:4px}
.sess .full{grid-column:1/-1}
.after li .own{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.kpi b{display:block;font-size:26px;line-height:1.2;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--mut)}
.dist{display:flex;height:28px;border-radius:9px;overflow:hidden;margin:8px 0}
.dist i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.gtw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.gt{min-width:960px;position:relative}
.gt .row{display:grid;grid-template-columns:300px 1fr;border-bottom:1px solid var(--line);min-height:34px;align-items:center}
.gt .row:last-child{border-bottom:0}
.gt .lbl{padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.gt .lbl .gk{flex:none;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--pri)}
.gt .trk{position:relative;height:34px;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:11.1111% 100%}
.gt .head .trk{height:40px;background:none}
.gt .head .wk{position:absolute;top:0;width:11.1111%;text-align:center;font-size:11.5px;color:var(--mut);padding-top:4px;line-height:1.2}
.gt .grp{background:var(--bg);font-weight:700;font-size:12.5px;color:var(--pri);padding:5px 10px;grid-column:1/-1}
.gt .bar{position:absolute;top:8px;height:18px;border-radius:7px;background:var(--pri2);opacity:.85}
.gt .bar.done{background:var(--ok)}
.gt .bar.late{background:var(--warn)}
.gt .bar.next{background:var(--mut);opacity:.5}
.gt .tdy{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend2 span:before{content:"";display:inline-block;width:12px;height:8px;border-radius:3px;background:var(--c);margin-right:6px}
.cal2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.cal{border:1px solid var(--line);border-radius:14px;padding:12px}
.cal h5{margin:0 0 8px;font-size:14px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12.5px}
.cal .gr b{color:var(--mut);font-size:11px}
.cal .d{aspect-ratio:1.3;display:grid;place-items:center;border-radius:8px;position:relative}
.cal .d.s{background:var(--soft);color:var(--pri);font-weight:800}
.cal .d.s.dn{background:var(--ok-soft);color:var(--ok)}
.cal .d.t{outline:2px solid var(--bad)}
.cal .d.o{opacity:.35}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.todo li:last-child{border:0}
.todo .dd{flex:none;background:var(--soft);color:var(--pri);border-radius:9px;padding:2px 8px;font-weight:700;font-size:12.5px}
.vcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vc{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.vc .t{font-weight:700}
.btn{display:inline-block;text-decoration:none;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;text-align:center}
.btn.off{background:var(--line);color:var(--mut);cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#06182c}
.floatpill{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--mut);pointer-events:none}
footer.ft{text-align:center;color:var(--mut);font-size:12.5px;padding:10px 0 70px}
.edtb{position:fixed;right:14px;bottom:56px;z-index:60;background:var(--card);border:2px solid var(--warn);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;max-width:260px;font-size:12.5px}
.edtb .btn{padding:6px 10px;font-size:12.5px}
.edtb .row{display:flex;gap:6px;flex-wrap:wrap}
body.editing .ed{outline:1px dashed var(--warn);outline-offset:2px;border-radius:4px;cursor:text;min-width:20px;display:inline-block}
body.editing li .ed,body.editing p .ed{display:inline}
.lk{width:100%;font:inherit;font-size:12.5px;border:1px solid var(--warn);border-radius:8px;padding:5px 8px;background:var(--card);color:var(--ink)}
.dnchk{font-size:12.5px;display:flex;gap:6px;align-items:center;color:var(--warn);font-weight:600}
@media(max-width:980px){.cards4,.kpis,.g4{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.g3,.vcards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.wrap{padding:0 12px}.hero{padding:18px;border-radius:16px}.cards4,.kpis,.g2,.g3,.g4,.vcards,.steps,.cal2{grid-template-columns:1fr}section.blk{padding:16px;border-radius:16px}.sess summary{grid-template-columns:62px 1fr}.sess summary .chip{grid-column:2}.sess .body{grid-template-columns:1fr}.top .bar .x2{display:none}.gt .row{grid-template-columns:200px 1fr}}
.lg{display:flex;align-items:center;gap:10px}.lg img{height:28px;width:auto;display:block}
:root[data-theme="dark"] header.top .lg{background:#fff;border-radius:10px;padding:4px 12px}
.lg.big{background:#fff;border-radius:16px;padding:10px 20px;gap:14px}.lg.big img{height:38px}.lg.big .x{color:#5b6f89}
@media(max-width:640px){.lg img{height:24px}.lg.big{padding:8px 14px;gap:10px}.lg.big img{height:28px}}
@media print{header.top,.floatpill,.edtb{display:none}}
</style>
</head>

function gantt(){
 var RS=ts('2026-10-19'),RE=ts('2026-12-20');var span=(RE-RS)/DAY+1;
 var wk='';for(var w=0;w<9;w++){var d=new Date(RS+w*7*DAY);var dd=String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');wk+='<div class="wk" style="left:'+(w*100/9)+'%">Tuần '+(43+w)+'<br>'+dd+'</div>';}
 var rows='<div class="row head"><div class="lbl"><b>Hạng mục</b></div><div class="trk">'+wk+'</div></div>';
 var last='';
 D.tasks.forEach(function(t,i){
  if(t.g!==last){rows+='<div class="row"><div class="grp">'+esc(t.g)+'</div></div>';last=t.g;}
  var s=ts(t.s),e=ts(t.e);var l=(s-RS)/DAY/span*100,w=((e-s)/DAY+1)/span*100;var st=taskState(t);
  rows+='<div class="row"><div class="lbl">'+(t.k?'<span class="gk">'+esc(t.k)+'</span>':'')+'<span>'+E('tasks.'+i+'.n')+'</span></div><div class="trk"><div class="bar '+(st==='done'?'done':st==='late'?'late':st==='next'?'next':'')+'" style="left:'+l+'%;width:'+w+'%" title="'+dm(t.s)+' – '+dm(t.e)+'"></div></div></div>';
 });
 var tl=(T-RS)/DAY/span*100;
 return '<div class="gtw"><div class="gt">'+rows+(tl>=0&&tl<=100?'<div class="tdy" style="left:calc(300px + (100% - 300px) * '+(tl/100)+')"></div>':'')+'</div></div><div class="legend2"><span style="--c:var(--ok)">Hoàn thành</span><span style="--c:var(--pri2)">Đang thực hiện</span><span style="--c:var(--warn)">Đang hoàn thiện</span><span style="--c:var(--mut)">Sắp tới</span><span style="--c:var(--bad)">Hôm nay</span></div>';

  var first=new Date(Date.UTC(m[0],m[1],1));var wd=(first.getUTCDay()+6)%7;var dim=new Date(Date.UTC(m[0],m[1]+1,0)).getUTCDate();
  var cells='';['T2','T3','T4','T5','T6','T7','CN'].forEach(function(x){cells+='<b>'+x+'</b>';});
  for(var i=0;i<wd;i++)cells+='<span></span>';
  for(var d=1;d<=dim;d++){var iso=m[0]+'-'+String(m[1]+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var s=smap[iso];var c='d';if(s)c+=' s'+(s.done?' dn':'');if(ts(iso)===T)c+=' t';

function msg(t){var m=document.getElementById('edmsg');if(m)m.textContent=t;}
function bind(){
 document.getElementById('thm').onclick=function(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',c);try{localStorage.setItem('lt_theme',c);}catch(e){}};
 document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){var el=document.getElementById(b.getAttribute('data-go'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});};});
 document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){var i=b.getAttribute('data-tab');document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('on',x===b);});document.querySelectorAll('[data-pane]').forEach(function(p){p.style.display=p.getAttribute('data-pane')===i?'':'none';});};});
 if(EDIT){
  document.querySelectorAll('.ed').forEach(function(el){el.addEventListener('input',function(){setP(D,el.getAttribute('data-p'),el.textContent);save();});el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur();}});});
  document.querySelectorAll('input.lk').forEach(function(el){el.addEventListener('change',function(){setP(D,el.getAttribute('data-p'),el.value.trim());save();render();});});
  document.querySelectorAll('[data-chk]').forEach(function(el){el.addEventListener('change',function(){setP(D,el.getAttribute('data-chk'),el.checked);save();render();});});
  document.getElementById('cp').onclick=function(){var s=out();try{navigator.clipboard.writeText(s).then(function(){msg('Đã sao chép. Dán vào file index.html rồi lưu.');},function(){msg('Không sao chép được, thử Tải HTML.');});}catch(e){msg('Không sao chép được, thử Tải HTML.');}};
  document.getElementById('dl').onclick=function(){try{var u=URL.createObjectURL(new Blob([out()],{type:'text/html'}));var a=document.createElement('a');a.href=u;a.download='index.html';document.body.appendChild(a);a.click();a.remove();msg('Đã tạo file index.html.');}catch(e){msg('Trình duyệt chặn tải, hãy dùng Sao chép HTML.');}};
  document.getElementById('rs').onclick=function(){try{localStorage.removeItem(DRAFTKEY);}catch(e){}location.reload();};
 }
}
function spy(){
 var y=window.scrollY+160;var idx=0;
 for(var i=0;i<8;i++){var el=document.getElementById('s'+i);if(el&&el.getBoundingClientRect().top+window.scrollY<=y)idx=i;}
 document.querySelectorAll('#nav button').forEach(function(b,i){b.classList.toggle('on',i===idx);if(i===idx){var n=document.getElementById('nav');var l=b.offsetLeft-n.clientWidth/2+b.clientWidth/2;if(n.scrollWidth>n.clientWidth)n.scrollLeft=l;}});
 var fp=document.getElementById('fp');if(fp)fp.textContent=SECS[idx]+' '+(idx+1)+'/8';
}
window.addEventListener('scroll',spy,{passive:true});
render();
})();
</script>
</body>
</html>
